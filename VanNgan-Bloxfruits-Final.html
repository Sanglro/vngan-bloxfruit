<title>VanNgan Bloxfruits</title>
<style>
    body {
        background: radial-gradient(circle at center, #000 40%, #020a02);
        font-family: 'Poppins', sans-serif;
        text-align: center;
        color: white;
        margin: 0;
        padding: 0;
    }
    .logo {
        width: 180px;
        margin-top: 60px;
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(0, 255, 180, 0.5);
        animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
        from { box-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa; }
        to { box-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffaa; }
    }
    h1 {
        color: #00ffcc;
        font-size: 2.5em;
        margin: 20px 0 10px;
        text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }
    p {
        font-size: 1.1em;
        color: #cfcfcf;
    }
    a.button {
        display: inline-block;
        margin-top: 30px;
        padding: 14px 35px;
        background: #00ffcc;
        color: #000;
        text-decoration: none;
        border-radius: 40px;
        font-weight: bold;
        font-size: 1.2em;
        box-shadow: 0 0 25px #00ffcc;
        transition: 0.3s;
    }
    a.button:hover {
        background: #00ffaa;
        box-shadow: 0 0 35px #00ffaa, 0 0 60px #00ffaa;
    }
</style>
